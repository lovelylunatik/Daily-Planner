<!DOCTYPE html>
<html>
<head><title>Texture Test</title><link rel="stylesheet" href="/_astro/Layout.CnmuXXOL.css"></head>
<body class="min-h-screen bg-[var(--deep)] text-[var(--text-1)] antialiased vignette">
  <div style="padding:40px; max-width:600px; margin:auto; display:flex; flex-direction:column; gap:24px;">
    <div class="pane-star-chart paper-lift paper-grain relative p-5 h-32 flex items-center justify-center" style="transform:rotate(-1deg);">
      <span class="hanging-star" style="top:10px;right:12px;"></span>
      <span class="compass-star absolute top-2 right-4"></span>
      <div class="text-[var(--gold)] font-typewriter">STAR CHART PANE</div>
    </div>
    <div class="pane-tarot paper-lift paper-grain filigree-frame relative p-5 h-32 flex items-center justify-center" style="transform:rotate(0.5deg);">
      <span class="hanging-star" style="top:12px;left:16px;"></span>
      <div class="text-[var(--gold)] font-typewriter">TAROT / FILIGREE PANE</div>
    </div>
    <div class="pane-wax-seal paper-lift paper-grain deckled linen relative p-5 h-32 flex items-center justify-center" style="transform:rotate(-0.5deg);">
      <div class="flex items-center gap-3">
        <span class="wax-seal-check"></span>
        <span class="text-[var(--text-1)] font-serif">Wax Seal Checkbox</span>
      </div>
    </div>
    <div class="pane-parchment paper-lift paper-grain lace-frame relative p-5 h-32 flex items-center justify-center" style="transform:rotate(0.3deg);">
      <div class="text-[var(--text-1)] font-serif">PARCHMENT / LACE PANE</div>
    </div>
    <div class="newspaper-overlay pane-sundial paper-lift paper-grain sun-rays relative p-5 h-32 flex items-center justify-center" style="transform:rotate(-0.8deg);">
      <div class="text-[var(--gold)] font-typewriter">SUN RAYS + NEWSPAPER</div>
    </div>
    <div class="pane-celestial paper-lift paper-grain relative p-5 h-32 flex items-center justify-center" style="transform:rotate(1deg);">
      <div class="text-[var(--gold)] font-typewriter">CELESTIAL PANE</div>
    </div>
    <div class="ritual-strip carry-glow flex items-center gap-3 py-2 px-3">
      <span class="wax-seal-check checked"></span>
      <span>Ritual Strip with Carry Glow</span>
    </div>
  </div>
</body>
</html>
